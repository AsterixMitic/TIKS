services:
  npp-backend:
    build:
      context: ../dotnet
      dockerfile: Dockerfile
    container_name: npp-backend
    ports:
      - "5000:8080"
    volumes:
      - ../dotnet:/app
      # Exclude build artifacts from syncing to host
      - /app/NppApi/bin
      - /app/NppApi/obj
      - /app/NppCore/bin
      - /app/NppCore/obj
    working_dir: /app/NppApi
    command: dotnet watch run --urls "http://0.0.0.0:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_WATCH_RESTART_ON_RUDE_EDIT=true
      - Cassandra__ContactPoints__0=cassandra
      - Cassandra__Port=9042
      - Cassandra__Keyspace=npp
      - Redis__ConnectionString=redis:6379
    depends_on:
      cassandra:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - npp-network

  npp-frontend:
    build:
      context: ../react
      dockerfile: Dockerfile
    container_name: npp-frontend
    ports:
      - "3000:5173"
    volumes:
      - ../react:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_URL=http://localhost:5000
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - npp-backend
    networks:
      - npp-network

  cassandra:
    image: cassandra:5
    container_name: npp-cassandra
    ports:
      - "9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    environment:
      - CASSANDRA_CLUSTER_NAME=npp-cluster
      - CASSANDRA_DC=dc1
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - npp-network

  redis:
    image: redis:7-alpine
    container_name: npp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - npp-network

  npp-tests:
    build:
      context: ../dotnet
      dockerfile: Dockerfile.test
    container_name: npp-tests
    profiles:
      - test
    environment:
      - NPP_BACKEND_URL=http://npp-backend:8080
      - NPP_FRONTEND_URL=http://npp-frontend:5173
      - CASSANDRA_HOST=cassandra
      - NPP_PW_HEADLESS=true
      - NPP_PW_SLOWMO_MS=300
      - NPP_PW_COLOR_SCHEME=dark
      - NPP_PW_ARTIFACTS_DIR=playwright-artifacts
      - NPP_PW_VIEWPORT_WIDTH=1280
      - NPP_PW_VIEWPORT_HEIGHT=720
    depends_on:
      cassandra:
        condition: service_healthy
      redis:
        condition: service_started
      npp-backend:
        condition: service_started
      npp-frontend:
        condition: service_started
    networks:
      - npp-network

networks:
  npp-network:
    driver: bridge

volumes:
  cassandra-data:
  redis-data:
